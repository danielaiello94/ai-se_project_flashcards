<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Daniel Aiello" />
    <meta
      name="description"
      content="An interactive flashcard webpage used for studying HTML and CSS"
    />
    <meta
      name="keywords"
      content="study aids, flashcards, learning materials"
    />
    <title>Flashcards For Studying HTML and CSS</title>
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="assets/vendor/normalize.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <script src="./assets/js/index.js" type="module"></script>
  </head>

  <body class="page">
    <header class="header">
      <h1 class="header__title">
        <a class="header__link" href="/">Flash Cards</a>
      </h1>
      <nav class="nav">
        <ul class="nav__links">
          <li><a href="#home" class="nav__link">My Decks</a></li>
          <li><a href="#about" class="nav__link">About</a></li>
        </ul>
      </nav>
    </header>
    <main class="page__main-content">
      <section id="home" class="decks">
        <h2 class="decks__title">My Decks</h2>

        <div class="decks__content">
          <ul class="decks__list"></ul>

          <button class="decks__new-decks-btn" type="button">+ New Deck</button>
        </div>

        <template id="deck-template">
          <li class="deck">
            <h3 class="deck__title">Basic HTML Tags</h3>

            <div class="deck__row">
              <p class="deck__count"></p>

              <button
                class="deck__delete-btn"
                type="button"
                aria-label="Delete this deck"
              ></button>
            </div>

            <a href="#" class="deck__link" aria-label="Open deck"></a>
          </li>
        </template>
      </section>
      <section id="about" class="about">
        <h2>About Flash Cards</h2>
        <p>
          This application helps you study HTML and CSS using interactive
          flashcards.
        </p>
      </section>

      <section id="not-found" class="not-found">
        <h2 class="not-found__status-code">404</h2>
        <p class="not-found__text">Sorry, nothing found!</p>
      </section>
      <section id="carousel">
        <h2 class="carousel__title">HTML Tags Deck · 1/10</h2>
        <div class="carousel__card-container">
          <button
            disabled
            class="carousel__btn carousel__btn_type_left carousel__btn_disabled"
            type="button"
            aria-label="Go to previous card"
          ></button>
          <div class="carousel__card">
            <p class="carousel__card-text">&lt;body&gt;&lt;/body&gt;</p>
          </div>
          <button
            class="carousel__btn carousel__btn_type_right"
            type="button"
            aria-label="Go to next card"
          ></button>
        </div>
        <button
          class="carousel__btn carousel__btn_type_flip"
          type="button"
          aria-label="Flip card"
        ></button>
      </section>
    </main>
    <footer class="footer">
      <p class="footer__text">&copy; 2026 Daniel Aiello</p>
    </footer>
  </body>
</html>
